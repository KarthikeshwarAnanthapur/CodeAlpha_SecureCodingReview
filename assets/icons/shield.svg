<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Background circle gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#060e18"/>
    </radialGradient>

    <!-- Shield body gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#00cc44"/>
    </linearGradient>

    <!-- Shield inner glow -->
    <linearGradient id="shieldInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0.08"/>
    </linearGradient>

    <!-- Glow filter for shield -->
    <filter id="shieldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Glow filter for checkmark -->
    <filter id="checkGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark rounded background -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>

  <!-- Subtle inner border -->
  <rect x="1" y="1" width="62" height="62" rx="13.5" fill="none"
        stroke="rgba(0,229,255,0.12)" stroke-width="1"/>

  <!-- Shield body fill -->
  <path d="M32 8 L52 16 L52 34 C52 46 42 56 32 60 C22 56 12 46 12 34 L12 16 Z"
        fill="url(#shieldInner)"
        filter="url(#shieldGlow)"/>

  <!-- Shield outline -->
  <path d="M32 8 L52 16 L52 34 C52 46 42 56 32 60 C22 56 12 46 12 34 L12 16 Z"
        fill="none"
        stroke="url(#shieldGrad)"
        stroke-width="2.5"
        stroke-linejoin="round"
        filter="url(#shieldGlow)"/>

  <!-- Inner shield layer for depth -->
  <path d="M32 14 L46 20 L46 34 C46 43 40 51 32 54 C24 51 18 43 18 34 L18 20 Z"
        fill="none"
        stroke="rgba(0,255,136,0.3)"
        stroke-width="1"
        stroke-linejoin="round"/>

  <!-- Checkmark — glowing green -->
  <polyline points="22,33 29,40 43,25"
        fill="none"
        stroke="url(#shieldGrad)"
        stroke-width="4"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#checkGlow)"/>
</svg>
